name: SEMS Production CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install backend dependencies
      working-directory: ./backend_api
      run: npm ci
    # - name: Run Backend Tests
    #   working-directory: ./backend_api
    #   run: npm test

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dashboard dependencies
      working-directory: ./admin_dashboard
      run: npm ci
    - name: Build Next.js Dashboard
      working-directory: ./admin_dashboard
      run: npm run build

  build-ai-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install AI dependencies
      working-directory: ./ai_service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    # - name: Run Python Tests
    #   working-directory: ./ai_service
    #   run: pytest

  deploy-to-production:
    needs: [build-and-test-backend, build-dashboard, build-ai-service]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3
    
    # In a real scenario, this step would SSH into the production server
    # and execute 'docker-compose up -d --build'
    - name: Deploy via SSH
      run: echo "Deploying to Production Server via docker-compose..."
