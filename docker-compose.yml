version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sems_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API
  backend:
    build: 
      context: ./backend_api
    container_name: sems_backend
    environment:
      - PORT=3000
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai_service:8000
      - AI_API_KEY=${AI_API_KEY}
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 3. Next.js Admin Dashboard
  dashboard:
    build:
      context: ./admin_dashboard
    container_name: sems_dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # 4. Python AI Service
  ai_service:
    build:
      context: ./ai_service
    container_name: sems_ai_service
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - MOCK_AI=${MOCK_AI}
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 5. Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: sems_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # 6. Grafana for Visualizing Metrics
  grafana:
    image: grafana/grafana:latest
    container_name: sems_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:

